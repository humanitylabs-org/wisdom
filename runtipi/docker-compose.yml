services:
  wisdom:
    # runtime.package: source. Official multi-arch Python; the App Manager mounts this repo at the pinned commit.
    image: python:3.12-slim@sha256:a6e34c598f2467ed0e9a8d349809fcd8b5c603269512df273a0bb1784edc11b1
    working_dir: /app
    command: [python, start.py]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9200/healthz',timeout=2)"]
      interval: 15s
      timeout: 3s
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID]
    security_opt: ['no-new-privileges:true']
    read_only: true
    mem_limit: 512m
    tmpfs: [/tmp]
    environment:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
      WISDOM_BASE: ''
      WISDOM_CONTAINER: '1'
      WISDOM_PORT: '9200'
      WISDOM_DATA: /data
      WISDOM_LIBRARY: /media/Wisdom
      WISDOM_ADMIT: disabled
      WISDOM_WIZARD_ORIGIN: ''
      WISDOM_TIMEZONE: ${WISDOM_TIMEZONE:-UTC}
      WISDOM_ORIGINS: ${WISDOM_ORIGINS:-}
      WISDOM_COLLECTION_SOURCE: ${WISDOM_COLLECTION_SOURCE:-}
      WISDOM_DISCUSS_URL: ${WISDOM_DISCUSS_URL:-}
      WISDOM_DISCUSS_TOKEN: ${WISDOM_DISCUSS_TOKEN:-}
    volumes:
      - ${APP_SOURCE_DIR}:/app:ro
      - ${APP_DATA_DIR}/data:/data
      - ${ROOT_FOLDER_HOST}/media/Wisdom:/media/Wisdom
      - ${APP_DATA_DIR}/sources:/sources:ro
    x-runtipi:
      is_main: true
      internal_port: 9200
x-runtipi:
  schema_version: 2
  overrides: []
