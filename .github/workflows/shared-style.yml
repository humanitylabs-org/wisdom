name: Shared style snapshot
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  style-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tests -p test_shared_style.py -v
